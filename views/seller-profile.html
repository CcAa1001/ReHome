<div class="seller-profile-container" style="max-width: 1200px; margin: 0 auto; padding: 40px 20px; font-family: var(--sans);">
  
  <div style="margin-bottom: 24px;">
    <button type="button" id="sp-back-btn" style="cursor:pointer; border:0; background:transparent; color:#78716c; padding:0; font:inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 4px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Back
    </button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 40px; background: white; padding: 40px; border-radius: 16px; border: 1px solid #e7e5e4; box-shadow: inset 0 4px 15px rgba(0,0,0,0.02), 0 4px 10px rgba(0,0,0,0.03);">
    <div style="width: 100px; height: 100px; background: #f2f0eb; border-radius: 50%; overflow: hidden; margin-bottom: 16px; border: 2px solid #e7e5e4;">
      <img id="sp-avatar" src="" alt="Seller Avatar" style="width: 100%; height: 100%; object-fit: cover; display: none;">
    </div>
    <h1 id="sp-name" style="font-family: var(--serif); font-size: 32px; color: #1c1917; margin: 0 0 8px 0;">Loading...</h1>
    <div id="sp-location-container" style="font-size: 14px; color: #78716c; margin-bottom: 16px; display: none; align-items: center; gap: 4px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <span id="sp-location"></span>
    </div>
    <p id="sp-description" style="color: #57534e; line-height: 1.6; max-width: 600px; margin: 0; font-size: 15px;"></p>
  </div>

  <div style="margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between;">
    <h2 style="font-family: var(--serif); font-size: 24px; color: #1c1917; margin: 0;">Shop Listings</h2>
    <div id="sp-product-count" style="font-size: 14px; color: #78716c;"></div>
  </div>

  <div id="sp-products-grid" class="rec-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;">
    <!-- Products will be injected here -->
  </div>

</div>
