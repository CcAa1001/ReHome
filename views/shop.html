<div class="page-shell split-page">
  <aside class="filter-panel">
    <h2>Category</h2>
    <div class="filter-group">
      <label class="custom-checkbox"><input type="checkbox" name="category" value="all" checked><span class="checkmark"></span> All Furniture</label>
      <label class="custom-checkbox"><input type="checkbox" name="category" value="seating"><span class="checkmark"></span> Seating</label>
      <label class="custom-checkbox"><input type="checkbox" name="category" value="storage"><span class="checkmark"></span> Storage & Tables</label>
      <label class="custom-checkbox"><input type="checkbox" name="category" value="textiles"><span class="checkmark"></span> Textiles</label>
      <label class="custom-checkbox"><input type="checkbox" name="category" value="decor"><span class="checkmark"></span> Decor</label>
    </div>
    <h2>Price Range</h2>
    <div class="price-slider-container">
      <div class="slider-track">
        <div class="slider-fill"></div>
        <input type="range" min="0" max="5000" value="0" class="slider-thumb slider-left">
        <input type="range" min="0" max="5000" value="5000" class="slider-thumb slider-right">
      </div>
      <div class="price-inputs">
        <div class="price-box"><span>$</span> 0</div><div class="price-dash">-</div><div class="price-box"><span>$</span> 5000+</div>
      </div>
    </div>
    <h2>Condition</h2>
    <div class="filter-group">
      <label class="custom-checkbox"><input type="checkbox" name="condition" value="like-new" checked><span class="checkmark"></span> Like New</label>
      <label class="custom-checkbox"><input type="checkbox" name="condition" value="excellent" checked><span class="checkmark"></span> Excellent</label>
      <label class="custom-checkbox"><input type="checkbox" name="condition" value="good"><span class="checkmark"></span> Good</label>
      <label class="custom-checkbox"><input type="checkbox" name="condition" value="fair"><span class="checkmark"></span> Fair</label>
    </div>
    <article class="eco-card">
      <span>Eco Choice</span>
      <p>Shop preloved to reduce carbon footprint by up to 82% per item.</p>
    </article>
  </aside>
  
  <section class="catalog-content">
    <div class="catalog-header">
      <div><h1>Curated Findings</h1><p>Discover 124 preloved architectural gems.</p></div>
      <div class="catalog-controls">
        <div class="view-toggles">
          <button class="active" type="button" aria-label="Grid view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></button>
          <button type="button" aria-label="List view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></button>
        </div>
        <div class="sort-dropdown">
          <span class="sort-label">Sort by:</span>
          <select><option>Newest Added</option><option>Best Selling</option><option>Price: Low to High</option><option>Price: High to Low</option></select>
        </div>
      </div>
    </div>
    <div class="catalog-grid" data-catalog-products></div>
    <button class="outline-wide" type="button" data-action="load-more">Load More Treasures</button>
  </section>
</div>
