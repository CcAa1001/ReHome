<div class="page-shell settings-layout">
  <section><span class="eyebrow">Workspace</span><h1>Settings &amp; Database</h1><p class="muted">Tune your ReHome experience.</p></section>
  <section class="settings-grid">
    <form class="settings-card" data-settings-form>
      <h2>Preferences</h2>
      <label><span>Currency</span><select name="currency"><option value="USD">USD</option><option value="IDR">IDR</option></select></label>
      <label><span>Theme</span><select name="theme"><option value="light">Light</option><option value="soft">Soft</option></select></label>
      <label class="toggle-row"><span>Email notifications</span><input name="emailNotifications" type="checkbox"></label>
      <button class="primary-button" type="submit">Save Settings</button>
    </form>
  </section>
</div>
