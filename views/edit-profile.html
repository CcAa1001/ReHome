<div style="max-width: 600px; margin: 0 auto; padding: 0 24px 120px; font-family: var(--sans); color: #1c1917; box-sizing: border-box;">
  
  <div style="padding: 40px 0 24px; display: flex; align-items: center; gap: 16px;">
    <button data-route="profile" style="background: white; border: 1px solid #d6d3d1; color: #1c1917; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='#fbfaf9'" onmouseout="this.style.background='white'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; font-family: var(--serif, Georgia, serif);">Edit Profile</h1>
  </div>

  <div style="background: white; border: 1px solid #e7e5e4; border-radius: 16px; padding: 32px;">
    
    <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 32px;">
      <div style="position: relative; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" onclick="document.getElementById('edit-avatar-upload').click()" title="Change Avatar">
        <div id="edit-avatar-img" style="width: 112px; height: 112px; border-radius: 50%; background: #f0f4ea; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; color: #526442; border: 3px solid #e7e5e4; overflow: hidden;">
          <span id="edit-initial">U</span>
        </div>
        <div style="position: absolute; bottom: 4px; right: 4px; width: 32px; height: 32px; background: #3d5a30; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </div>
        <input type="file" id="edit-avatar-upload" accept="image/*" style="display: none;">
      </div>
      <div style="margin-top: 12px; font-size: 14px; color: #78716c;">Click to update photo</div>
    </div>

    <form id="edit-profile-form" style="display: flex; flex-direction: column; gap: 24px;" onsubmit="event.preventDefault();">
      
      <div>
        <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #1c1917;">Full Name</label>
        <input type="text" id="edit-fullname" placeholder="e.g. Vivian" style="width: 100%; padding: 12px 16px; border: 1px solid #d6d3d1; border-radius: 8px; font-size: 15px; font-family: var(--sans); box-sizing: border-box; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3d5a30'" onblur="this.style.borderColor='#d6d3d1'">
      </div>

      <div>
        <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #1c1917;">Shop Name <span style="color: #a8a29e; font-weight: 400;">(Optional)</span></label>
        <input type="text" id="edit-shopname" placeholder="e.g. Vivian's Vintage" style="width: 100%; padding: 12px 16px; border: 1px solid #d6d3d1; border-radius: 8px; font-size: 15px; font-family: var(--sans); box-sizing: border-box; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3d5a30'" onblur="this.style.borderColor='#d6d3d1'">
      </div>

      <div>
        <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #1c1917;">Location</label>
        <input type="text" id="edit-location" placeholder="e.g. Copenhagen, DK" style="width: 100%; padding: 12px 16px; border: 1px solid #d6d3d1; border-radius: 8px; font-size: 15px; font-family: var(--sans); box-sizing: border-box; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3d5a30'" onblur="this.style.borderColor='#d6d3d1'">
      </div>

      <div>
        <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #1c1917;">Bio / Description</label>
        <textarea id="edit-description" rows="4" placeholder="Tell us about yourself..." style="width: 100%; padding: 12px 16px; border: 1px solid #d6d3d1; border-radius: 8px; font-size: 15px; font-family: var(--sans); box-sizing: border-box; outline: none; resize: vertical; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3d5a30'" onblur="this.style.borderColor='#d6d3d1'"></textarea>
      </div>

      <div style="background: #f0f4ea; border: 1px solid #3d5a30; border-radius: 8px; padding: 16px;">
        <label style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 14px; font-weight: 700; color: #3d5a30;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg> Gemini API Key <span style="font-weight: 400; color: #526442;">(For AI Price Checker)</span></label>
        <input type="password" id="edit-gemini-key" placeholder="AIzaSy..." style="width: 100%; padding: 12px 16px; border: 1px solid #c8c6c0; border-radius: 8px; font-size: 15px; font-family: monospace; box-sizing: border-box; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3d5a30'" onblur="this.style.borderColor='#c8c6c0'">
        <div style="font-size: 12px; color: #526442; margin-top: 8px;">Leave blank to use Demo Mode. Stored locally in your browser.</div>
      </div>

      <button type="submit" id="edit-save-btn" style="width: 100%; background: #3d5a30; border: none; color: white; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 8px;" onmouseover="this.style.background='#526442'" onmouseout="this.style.background='#3d5a30'">
        Save Profile
      </button>
    </form>

  </div>
</div>
